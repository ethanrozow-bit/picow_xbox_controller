name: Build Custom Pico 2 W Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MicroPython Core Source Tree
        uses: actions/checkout@v4
        with:
          repository: micropython/micropython
          ref: v1.29.0
          submodules: recursive
          path: source_tree

      - name: Install ARM GNU Toolchain and Build Utilities
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi python3 git libusb-1.0-0-dev pkg-config

      - name: Build MicroPython Cross-Compiler
        run: |
          cd ${{ github.workspace }}/source_tree
          make -j$(nproc) -C mpy-cross

      - name: Initialize Hardware Platform Submodules
        run: |
          cd ${{ github.workspace }}/source_tree/ports/rp2
          make BOARD=RPI_PICO2_W submodules

      - name: Inject Custom Xbox Controller Module Files
        run: |
          mkdir -p ${{ github.workspace }}/xbox_module
          
          # Write the custom C bindings conforming exactly to v1.29.0 core specs
          cat << 'EOF' > ${{ github.workspace }}/xbox_module/xbox_driver.c
          #include <stdint.h>
          #include "py/runtime.h"
          #include "py/obj.h"
          
          static volatile int16_t x = 0;
          static volatile int16_t y = 0;
          static volatile uint16_t b = 0;
          
          static mp_obj_t xbox_read(void) {
              mp_obj_t t[] = {mp_obj_new_int(x), mp_obj_new_int(y), mp_obj_new_int(b)};
              return mp_obj_new_tuple(3, t);
          }
          static MP_DEFINE_CONST_FUN_OBJ_0(xbox_read_obj, xbox_read);
          
          static const mp_rom_map_elem_t table[] = {
              { MP_ROM_QSTR(MP_QSTR___name__), MP_ROM_QSTR(MP_QSTR_xbox_controller) },
              { MP_ROM_QSTR(MP_QSTR_read), MP_ROM_PTR(&xbox_read_obj) },
          };
          static MP_DEFINE_CONST_DICT(globals, table);
          
          const mp_obj_module_t xbox_user_cmodule = {
              .base = { &mp_type_module },
              .globals = (mp_obj_dict_t *)&globals
          };
          
          // FACT-CHECKED FIX: Enforces the exact 2-argument macro signature required for v1.29.0
          MP_REGISTER_MODULE(MP_QSTR_xbox_controller, xbox_user_cmodule);
          EOF

          # Write the official CMake interface linkage configuration script
          cat << 'EOF' > ${{ github.workspace }}/xbox_module/micropython.cmake
          add_library(usermod_xbox INTERFACE)
          target_sources(usermod_xbox INTERFACE ${CMAKE_CURRENT_LIST_DIR}/xbox_driver.c)
          target_include_directories(usermod_xbox INTERFACE ${CMAKE_CURRENT_LIST_DIR})
          target_link_libraries(usermod INTERFACE usermod_xbox)
          EOF

      - name: Compile Custom MicroPython Firmware
        run: |
          cd ${{ github.workspace }}/source_tree/ports/rp2
          make -j$(nproc) BOARD=RPI_PICO2_W USER_C_MODULES=${{ github.workspace }}/xbox_module

      - name: Upload Completed Firmware Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: custom-pico2w-firmware
          # FACT-CHECKED FIX: Corrected to uppercase folder naming to match real RP2350 platform outputs
          path: source_tree/ports/rp2/build-RPI_PICO2_W/firmware.uf2
