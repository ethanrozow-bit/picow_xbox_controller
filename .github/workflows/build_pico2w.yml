name: Build Custom Pico 2 W Firmware

on:
  workflow_dispatch: # Allows manual trigger via the actions tab button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Root
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GNU Toolchain and Build Utilities
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential gcc-arm-none-eabi libnewlib-arm-none-eabi python3

      - name: Clone MicroPython Core Source Tree
        run: |
          git clone --recursive https://github.com source_tree

      - name: Initialize Hardware Platform Submodules
        run: |
          cd source_tree/ports/rp2
          make BOARD=RPI_PICO2_W submodules

      - name: Inject Custom Xbox Controller Module Files
        run: |
          # Create an absolute workspace directory for custom extensions
          mkdir -p ${{ github.workspace }}/xbox_module
          
          # Write the C binding logic
          cat << 'EOF' > ${{ github.workspace }}/xbox_module/xbox_driver.c
          #include "py/runtime.h"
          #include "py/obj.h"
          static int16_t x=0, y=0, b=0;
          static mp_obj_t xbox_read(void) {
              mp_obj_t t[] = {mp_obj_new_int(x), mp_obj_new_int(y), mp_obj_new_int(b)};
              return mp_obj_new_tuple(3, t);
          }
          static MP_DEFINE_CONST_FUN_OBJ_0(xbox_read_obj, xbox_read);
          static const mp_rom_map_elem_t table[] = {
              { MP_ROM_QSTR(MP_QSTR___name__), MP_ROM_QSTR(MP_QSTR_xbox_controller) },
              { MP_ROM_QSTR(MP_QSTR_read), MP_ROM_OBJ_&xbox_read_obj },
          };
          static MP_DEFINE_CONST_DICT(globals, table);
          const mp_obj_module_t xbox_user_cmodule = {.base = { &mp_type_module }, .globals = (mp_obj_dict_t *)&globals};
          MP_REGISTER_MODULE(MP_QSTR_xbox_controller, xbox_user_cmodule);
          EOF

          # Write the CMake configuration linking script
          cat << 'EOF' > ${{ github.workspace }}/xbox_module/micropython.cmake
          micropython_add_to_list(MICROPY_SOURCE_USERMOD ${CMAKE_CURRENT_LIST_DIR}/xbox_driver.c)
          EOF

      - name: Wipe Cache and Compile Custom MicroPython Firmware
        run: |
          cd source_tree/ports/rp2
          
          # 1. Force a clean cache wipe to prevent old compilation overlaps
          make BOARD=RPI_PICO2_W clean
          
          # 2. Compile using a fully-qualified absolute file path to the CMake wrapper
          make BOARD=RPI_PICO2_W USER_C_MODULES=${{ github.workspace }}/xbox_module/micropython.cmake

      - name: Upload Completed Firmware Binary Asset
        uses: actions/upload-artifact@v4
        with:
          name: custom-pico2w-firmware
          path: source_tree/ports/rp2/build-RPI_PICO2_W/firmware.uf2
